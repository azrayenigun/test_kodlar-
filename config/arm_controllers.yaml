controller_manager:
  ros__parameters:
    update_rate: 100  # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

arm_controller:
  ros__parameters:
    joints:
      - Joint_1
      - Joint_2
      - Joint_3
      - Joint_4
      - Joint_5
      - Joint_6
      - Gripper_Joint_1
      - Gripper_Joint_2
    
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity

    # EKLENMESİ GEREKENLER:
    state_publish_rate: 50.0 # Durum bilgisini daha sık güncelle
    action_monitor_rate: 20.0 # Hareket takibi hızı
    allow_partial_joints_goal: true # Bazı eklemler tam hedefe oturmazsa hata vermesini engeller
    
    constraints:
      stopped_velocity_tolerance: 0.01 # Durduğunda hızı tam sıfır kabul et
      goal_time: 0.0 # Hedefe ulaşma süresi kısıtlamasını kaldır (Hata payı tanır)
      Joint_1: { trajectory: 0.1, goal: 0.1 } # Hedefe 0.1 radyan yaklaşırsa "başarılı" say
      Joint_2: { trajectory: 0.1, goal: 0.1 } 
      Joint_3: { trajectory: 0.1, goal: 0.1 } 
      Joint_4: { trajectory: 0.1, goal: 0.1 } 
      Joint_5: { trajectory: 0.1, goal: 0.1 } 
      Joint_6: { trajectory: 0.1, goal: 0.1 } 
      # (Gerekirse diğer eklemler için de eklenebilir)
